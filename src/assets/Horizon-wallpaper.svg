<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Live Wallpaper</title>
  <defs>
    <linearGradient id="casing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f4f8"/>
      <stop offset="0.55" stop-color="#cfd6e1"/>
      <stop offset="1" stop-color="#9ba7ba"/>
    </linearGradient>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="452">
      <stop offset="0" stop-color="#162052"/>
      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <radialGradient id="bloom" gradientUnits="userSpaceOnUse" cx="400" cy="130" r="230">
      <stop offset="0" stop-color="#4a6df0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a6df0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#6a4df0"/>
      <stop offset="0.55" stop-color="#2f6ff0"/>
      <stop offset="1" stop-color="#3fb4ff"/>
    </linearGradient>
    <linearGradient id="r2" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#2f6ff0"/>
      <stop offset="0.6" stop-color="#44c8ff"/>
      <stop offset="1" stop-color="#9cf2ff"/>
    </linearGradient>
    <linearGradient id="r3" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#6fd6ff"/>
      <stop offset="0.7" stop-color="#d4f8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="scrim" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="452">
      <stop offset="0" stop-color="#050810" stop-opacity="0"/>
      <stop offset="1" stop-color="#050810" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="prog" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="290" y2="0">
      <stop offset="0" stop-color="#2f6ff0"/>
      <stop offset="1" stop-color="#6fd6ff"/>
    </linearGradient>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="200">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8cc2ff"/>
      <stop offset="1" stop-color="#2f6ff0"/>
    </radialGradient>
    <clipPath id="screen">
      <rect x="60" y="60" width="392" height="392" rx="64"/>
    </clipPath>
    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="knobShadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="ledGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Casing -->
  <rect x="36" y="46" width="440" height="440" rx="88" fill="#000000" opacity="0.38" filter="url(#bodyShadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="88" fill="url(#casing)"/>
  <rect x="37" y="37" width="438" height="438" rx="87" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2"/>
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="#6b778d" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Screen recess -->
  <rect x="60" y="61.5" width="392" height="392" rx="64" fill="#ffffff" opacity="0.7"/>
  <rect x="60" y="60" width="392" height="392" rx="64" fill="#0a1024"/>

  <!-- Wallpaper -->
  <g clip-path="url(#screen)">
    <rect x="60" y="60" width="392" height="392" fill="url(#bg)"/>
    <rect x="60" y="60" width="392" height="392" fill="url(#bloom)"/>

    <g fill="#ffffff">
      <circle cx="118" cy="110" r="2" opacity="0.7"/>
      <circle cx="176" cy="88" r="1.5" opacity="0.5"/>
      <circle cx="248" cy="124" r="1.5" opacity="0.45"/>
      <circle cx="96" cy="170" r="1.5" opacity="0.4"/>
      <circle cx="292" cy="84" r="2" opacity="0.6"/>
    </g>

    <g transform="translate(0 -24)">
      <!-- Glow layer -->
      <g filter="url(#blur)" opacity="0.7">
        <path d="M40,350 C140,290 220,390 310,310 C400,235 440,215 500,225 L500,290 C440,280 400,300 310,375 C220,455 140,355 40,415 Z" fill="url(#r2)"/>
        <path d="M40,250 C120,200 200,280 280,215 C350,160 430,120 500,110 L500,144 C430,154 350,194 280,249 C200,314 120,234 40,284 Z" fill="url(#r3)"/>
      </g>

      <!-- Ribbons -->
      <path d="M40,300 C130,230 210,330 300,250 C390,170 430,160 500,150 L500,230 C430,240 390,250 300,330 C210,410 130,310 40,380 Z" fill="url(#r1)" opacity="0.9"/>
      <path d="M40,350 C140,290 220,390 310,310 C400,235 440,215 500,225 L500,290 C440,280 400,300 310,375 C220,455 140,355 40,415 Z" fill="url(#r2)" opacity="0.92"/>
      <path d="M40,250 C120,200 200,280 280,215 C350,160 430,120 500,110 L500,144 C430,154 350,194 280,249 C200,314 120,234 40,284 Z" fill="url(#r3)"/>
      <path d="M40,300 C130,230 210,330 300,250 C390,170 430,160 500,150" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <path d="M40,350 C140,290 220,390 310,310 C400,235 440,215 500,225" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>

    <rect x="60" y="350" width="392" height="102" fill="url(#scrim)"/>

    <!-- Playback scrubber -->
    <path d="M78,404 L78,422 L94,413 Z" fill="#ffffff" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.92" stroke-width="2" stroke-linejoin="round"/>
    <rect x="112" y="410" width="308" height="6" rx="3" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="112" y="410" width="178" height="6" rx="3" fill="url(#prog)"/>
    <circle cx="290" cy="413" r="8" fill="#ffffff" filter="url(#knobShadow)"/>

    <!-- Glass reflection -->
    <rect x="60" y="60" width="392" height="140" fill="url(#gloss)"/>
  </g>
  <rect x="60" y="60" width="392" height="392" rx="64" fill="none" stroke="#06090f" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Activity LED -->
  <circle cx="420" cy="464" r="6" fill="#2f6ff0" opacity="0.8" filter="url(#ledGlow)"/>
  <circle cx="420" cy="464" r="5" fill="url(#led)"/>
  <circle cx="420" cy="464" r="5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
</svg>
