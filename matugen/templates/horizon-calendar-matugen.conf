# Horizon Calendar — wallpaper-derived color palette.
# Written to: ~/.config/event-horizon/horizon-calendar-matugen.conf
#
# Keys mirror the overridable slots in Horizon Calendar's theme.toml
# (src/ui/theme_toml.cpp kSlots), using .default.hex so the native color
# engine and matugen render identical output for the active mode.
#
# Synced into ~/.config/horizon-calendar/theme.toml under the section
# matching the shell's matugen_mode by the post-matugen hook.
# Format: key = "#RRGGBB" (soft fills carry an alpha suffix, "#RRGGBBAA").
bg_window = "{{ colors.surface_container_lowest.default.hex }}"
surface = "{{ colors.surface_container.default.hex }}"
surface_var = "{{ colors.surface_container_high.default.hex }}"
surface_var_hover = "{{ colors.surface_container_highest.default.hex }}"
surface_out = "{{ colors.surface_container_low.default.hex }}"
border = "{{ colors.outline_variant.default.hex }}"
border_soft = "{{ colors.surface_container_highest.default.hex }}"
ink = "{{ colors.on_surface.default.hex }}"
ink_muted = "{{ colors.on_surface_variant.default.hex }}"
ink_faint = "{{ colors.outline.default.hex }}"
primary = "{{ colors.primary.default.hex }}"
primary_soft = "{{ colors.primary.default.hex }}29"
primary_ink = "{{ colors.primary.default.hex }}"
tertiary = "{{ colors.tertiary.default.hex }}"
tertiary_soft = "{{ colors.tertiary.default.hex }}26"
error = "{{ colors.error.default.hex }}"
error_soft = "{{ colors.error.default.hex }}26"
