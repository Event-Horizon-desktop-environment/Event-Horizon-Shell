# Event Horizon matugen — Otter Shell terminal (otter-term) color fragment.
# Written to: ~/.config/otter-shell/otter-term-matugen.conf
#
# Colors are automatically synced to ~/.config/otter-shell/otter-term.conf
# by the Event Horizon matugen post-processing step when wallpaper changes.
# Enable: Event Horizon Settings -> Color engine -> "Otter / otter-term".
#
# Keys match otter-term’s flattened colors_* fields (otter-conf quoted #RRGGBB strings).
# 16-color mapping follows the same roles as matugen/kitty.conf (Material + base16), using .default.

colors_foreground = "{{ colors.on_surface.default.hex }}"
colors_background = "{{ colors.background.default.hex }}"
colors_cursor = "{{ colors.primary.default.hex }}"
colors_selection_background = "{{ colors.primary_container.default.hex }}"
colors_url_foreground = "{{ colors.secondary.default.hex }}"

colors_black = "{{ colors.surface.default.hex }}"
colors_bright_black = "{{ colors.surface_container_highest.default.hex }}"

colors_red = "{{ base16.base08.default.hex | lighten: -20.0 }}"
colors_bright_red = "{{ base16.base08.default.hex | lighten: 10.0 }}"

colors_green = "{{ colors.secondary_fixed_dim.default.hex }}"
colors_bright_green = "{{ colors.secondary_fixed.default.hex }}"

colors_yellow = "{{ colors.tertiary_fixed_dim.default.hex }}"
colors_bright_yellow = "{{ colors.tertiary_fixed.default.hex }}"

colors_blue = "{{ colors.on_primary_fixed_variant.default.hex }}"
colors_bright_blue = "{{ colors.primary.default.hex }}"

colors_magenta = "{{ colors.on_secondary_fixed_variant.default.hex }}"
colors_bright_magenta = "{{ colors.secondary.default.hex }}"

colors_cyan = "{{ colors.on_tertiary_fixed_variant.default.hex }}"
colors_bright_cyan = "{{ colors.tertiary.default.hex }}"

colors_white = "{{ colors.on_surface_variant.default.hex }}"
colors_bright_white = "{{ colors.on_surface.default.hex }}"
